<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Website Generator</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="masthead"><div id="connection" class="connection"><i></i><span>Conectando</span></div></header>
<main>
<section class="intro"><h1>Website Generator<span class="title-dot">.</span></h1><div class="edition"><strong id="edition-count">00</strong><span>prévias verificadas</span><span id="clock" class="sr-only"></span></div></section>
<section class="run-section" aria-labelledby="run-heading"><h2 id="run-heading" class="sr-only">Novo lote</h2><form id="batch-form"><label><span class="sr-only">Segmento</span><select name="industry" required aria-label="Segmento"><option value="">Carregando segmentos…</option></select></label><label><span class="sr-only">Cidade ou estado</span><input name="city" placeholder="Cidade ou estado" required maxlength="120" autocomplete="off"></label><label><span class="sr-only">Meta de prévias verificadas</span><input name="requested_count" type="number" value="3" min="1" max="100" step="1" inputmode="numeric" required aria-label="Meta de prévias verificadas" placeholder="Prévias"></label><button class="primary" type="submit">Enfileirar lote <span aria-hidden="true">↗</span></button><p class="form-note">Informe o segmento e a cidade. A meta conta prévias publicadas e verificadas, sem exigir contato comercial. Peça ao Codex para executar o lote.</p><p id="form-message" role="status" aria-live="polite"></p></form></section>
<section class="capacity" aria-labelledby="worker-heading"><div class="section-heading"><h2 id="worker-heading">Trabalhadores</h2><span id="capacity-note" class="subtle"></span></div><div id="workers" class="workers"></div><div id="funnel" class="queue-status"></div></section>
<section class="sheet" aria-labelledby="sheet-heading"><div class="section-heading"><h2 id="sheet-heading">Empresas <span id="sheet-count" class="count">0</span></h2><select id="batch-filter" aria-label="Filtrar por lote"><option value="all">Todos os lotes</option></select></div><div class="sheet-toolbar"><div id="stage-filters" class="filters" role="group" aria-label="Filtrar por etapa"><button data-filter="all" class="active" aria-pressed="true">Todos</button><button data-filter="working" aria-pressed="false">Em andamento</button><button data-filter="ready" aria-pressed="false">Prévia pronta</button><button data-filter="simulated" aria-pressed="false">Simulado</button><button data-filter="manual" aria-pressed="false">Manual <span id="manual-count">0</span></button><button data-filter="contacted" aria-pressed="false">Enviado</button><button data-filter="attention" aria-pressed="false">Atenção</button></div></div><div id="queue-status" class="queue-status" hidden></div><div id="jobs" class="jobs"></div></section>
</main>
<dialog id="job-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><span class="eyebrow">Detalhes</span><button id="close-dialog" aria-label="Fechar detalhes">✕</button></div><div id="dialog-content"></div></dialog>
</body></html>
